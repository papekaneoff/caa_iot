steps:
  # -------------------------
  # BACKEND (Django)
  # -------------------------
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/django-backend", "./backend"]
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/django-backend"]
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      [
        "run", "deploy", "django-backend",
        "--image", "gcr.io/$PROJECT_ID/django-backend",
        "--region", "europe-west1",
        "--platform", "managed",
        "--allow-unauthenticated",
        "--set-secrets", "DJANGO_SECRET_KEY=DJANGO_SECRET_KEY:latest,OPENWEATHER_API_KEY=OPENWEATHER_API_KEY:latest"
      ]
  # -------------------------
  # FRONTEND (Next.js)
  # -------------------------
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build", "-t", "gcr.io/$PROJECT_ID/nextjs-frontend",
        "--build-arg", "NEXT_PUBLIC_DJANGO_API_URL=https://django-backend-947281260717.europe-west1.run.app",
        "./frontend"
      ]
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/nextjs-frontend"]
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      [
        "run", "deploy", "nextjs-frontend",
        "--image", "gcr.io/$PROJECT_ID/nextjs-frontend",
        "--region", "europe-west1",
        "--platform", "managed",
        "--allow-unauthenticated"
      ]
  # -------------------------
  # DEVICE - VS (Voice Assistant)
  # -------------------------
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/vs", "./device"]
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/vs"]
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      [
        "run", "deploy", "vs",
        "--image", "gcr.io/$PROJECT_ID/vs",
        "--region", "europe-west1",
        "--platform", "managed",
        "--allow-unauthenticated",
        "--set-secrets", "OPENWEATHER_API_KEY=OPENWEATHER_API_KEY:latest"
      ]
  # -------------------------
  # DEVICE - GETWEATHER (Cloud Function)
  # -------------------------
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      [
        "functions", "deploy", "getweather",
        "--gen2",
        "--runtime", "python312",
        "--region", "europe-west1",
        "--source", "./device",
        "--entry-point", "ingest",
        "--trigger-http",
        "--allow-unauthenticated"
      ]

images:
  - "gcr.io/$PROJECT_ID/django-backend"
  - "gcr.io/$PROJECT_ID/nextjs-frontend"
  - "gcr.io/$PROJECT_ID/vs"

options:
  logging: CLOUD_LOGGING_ONLY