steps:
  # -------------------------
  # BACKEND (Django)
  # -------------------------
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "gcr.io/$PROJECT_ID/django-backend",
        "./backend"
      ]

  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "gcr.io/$PROJECT_ID/django-backend"
      ]

  # Deploy backend to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      [
        "run", "deploy", "django-backend",
        "--image", "gcr.io/$PROJECT_ID/django-backend",
        "--region", "europe-west1",
        "--platform", "managed",
        "--allow-unauthenticated"
      ]

  # -------------------------
  # FRONTEND (Next.js)
  # -------------------------
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t", "gcr.io/$PROJECT_ID/nextjs-frontend",
        "./frontend"
      ]

  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "gcr.io/$PROJECT_ID/nextjs-frontend"
      ]

  # Deploy frontend to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      [
        "run", "deploy", "nextjs-frontend",
        "--image", "gcr.io/$PROJECT_ID/nextjs-frontend",
        "--region", "europe-west1",
        "--platform", "managed",
        "--allow-unauthenticated"
      ]

images:
  - "gcr.io/$PROJECT_ID/django-backend"
  - "gcr.io/$PROJECT_ID/nextjs-frontend"

options:
  logging: CLOUD_LOGGING_ONLY