steps:
  # -------------------------
  # BACKEND (Django)
  # -------------------------
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/django-backend", "./backend"]
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/django-backend"]
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      [
        "run", "deploy", "django-backend",
        "--image", "gcr.io/$PROJECT_ID/django-backend",
        "--region", "europe-west1",
        "--platform", "managed",
        "--allow-unauthenticated",
        "--set-secrets", "DJANGO_SECRET_KEY=DJANGO_SECRET_KEY:latest,OPENWEATHER_API_KEY=OPENWEATHER_API_KEY:latest"
      ]
  # -------------------------
  # FRONTEND (Next.js)
  # -------------------------
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build", "-t", "gcr.io/$PROJECT_ID/nextjs-frontend",
        "--build-arg", "NEXT_PUBLIC_DJANGO_API_URL=https://django-backend-947281260717.europe-west1.run.app",
        "./frontend"
      ]
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/nextjs-frontend"]
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      [
        "run", "deploy", "nextjs-frontend",
        "--image", "gcr.io/$PROJECT_ID/nextjs-frontend",
        "--region", "europe-west1",
        "--platform", "managed",
        "--allow-unauthenticated"
      ]
  # -------------------------
  # VS (Voice Assistant)
  # -------------------------
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/vs", "./vs"]
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/vs"]
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      [
        "run", "deploy", "vs",
        "--image", "gcr.io/$PROJECT_ID/vs",
        "--region", "europe-west1",
        "--platform", "managed",
        "--allow-unauthenticated",
        "--set-env-vars", "GCP_PROJECT_ID=esoteric-storm-496611-p0",
        "--set-secrets", "OPENWEATHER_API_KEY=OPENWEATHER_API_KEY:latest"
      ]
  # -------------------------
  # GETWEATHER (Cloud Function)
  # -------------------------
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/getweather", "./getweather"]
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/getweather"]
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      [
        "run", "deploy", "getweather",
        "--image", "gcr.io/$PROJECT_ID/getweather",
        "--region", "europe-west1",
        "--platform", "managed",
        "--allow-unauthenticated"
      ]

images:
  - "gcr.io/$PROJECT_ID/django-backend"
  - "gcr.io/$PROJECT_ID/nextjs-frontend"
  - "gcr.io/$PROJECT_ID/vs"
  - "gcr.io/$PROJECT_ID/getweather"

options:
  logging: CLOUD_LOGGING_ONLY